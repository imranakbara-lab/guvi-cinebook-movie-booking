spring.application.name=cinebook-backend
server.port=${PORT:8080}

# ---------- Database ----------
# Local run uses an in-memory H2 database (no setup needed).
# For deployment set DATABASE_URL (Render) or DB_URL, DB_USERNAME, DB_PASSWORD
#   MySQL:      jdbc:mysql://host:3306/cinebook
#   PostgreSQL: jdbc:postgresql://host:5432/cinebook
spring.datasource.url=${DB_URL:jdbc:h2:mem:cinebook;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Tables go into their own schema (DB_SCHEMA) so this app can share a database with other apps.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:PUBLIC}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.h2.console.enabled=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:cinebook-dev-secret-key-change-this-in-production-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Default admin + demo data ----------
app.admin.email=${ADMIN_EMAIL:admin@cinebook.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-sample-data=${SEED_SAMPLE_DATA:true}

# ---------- Booking rules ----------
app.booking.hold-minutes=${BOOKING_HOLD_MINUTES:10}
app.booking.cancel-before-minutes=${CANCEL_BEFORE_MINUTES:60}

# ---------- Payment (Razorpay test keys; leave empty for simulated payments) ----------
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app,https://*.netlify.app}

# ---------- Email (Spring Boot Starter Mail) ----------
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:CineBook <no-reply@cinebook.app>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
